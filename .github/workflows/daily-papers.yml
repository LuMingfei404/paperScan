name: Daily Papers

on:
  schedule:
    # 每天 00:00 UTC = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PS_OUTPUT_DIR: data/papers
        run: python backend/papersnap.py

      - name: Commit generated data
        run: |
          git config user.name "papersnap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/papers
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily papers"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/papers

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
